name: hommeldorp-wordpress

# Sources/Examples
# https://github.com/chriszarate/docker-compose-wordpress/blob/master/docker-compose.yml

services:
  # This dev container arranges all the development tooling (Node/NPM, PHP/Composer, WP-CLI) and
  # mounts the plugin development directory into the container as a bind mount so that it
  # can be edited on both the host (edits in the IDE) and container (dev tooling).
  #
  # This container will fail on docker-compose up as the DB takes time to initialize, but it can
  # just be run again (see README.md).
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-env
    # runs the container with the same user ID as the host
    user: ${UID}:${GID}
    depends_on:
      - db
      - wp
    working_dir: /var/www/html
    volumes:
      - ./wp-app:/var/www/html
      - ./config/wp_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - type: bind
        source: ./plugins/contact-form
        target: /var/www/html/wp-content/plugins/contact-form
      - type: bind
        source: ./plugins/crowdfunding-banner
        target: /var/www/html/wp-content/plugins/crowdfunding-banner
#      - ./config/wp_php.ini:/etc/php/8.2/apache2/conf.d/99-local.ini
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${DB_NAME}"
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: "${DB_ROOT_PASSWORD}"

  wp:
    image: wordpress:latest # https://hub.docker.com/_/wordpress/
    # runs the container with the same user ID as the host
    # this is needed to ensure the Site Editor can write to the bind mount
    user: ${UID}:${GID}
    ports:
      - ${IP}:${PORT}:80 # change ip if required
    volumes:
      - ./config/wp_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wp-app:/var/www/html # Full wordpress project
      # using a bind mount allows both the host and the container to write to the theme
      - type: bind
        source: ./themes/hommeldorp
        target: /var/www/html/wp-content/themes/hommeldorp
      - type: bind
        source: ./uploads
        target: /var/www/html/wp-content/uploads
      - type: bind
        source: ./plugins/contact-form
        target: /var/www/html/wp-content/plugins/contact-form
      - type: bind
        source: ./plugins/crowdfunding-banner
        target: /var/www/html/wp-content/plugins/crowdfunding-banner
      #- ./wp-content/:/var/www/html/wp-content
      #- ./plugin-name/trunk/:/var/www/html/wp-content/plugins/plugin-name # Plugin development
      #- ./themes/hommeldorp/:/var/www/html/wp-content/themes/hommeldorp # Theme development
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: "${DB_NAME}"
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: "${DB_ROOT_PASSWORD}"
      CAP_SECRET_KEY: "${CAP_SECRET_KEY}"
      # read by the contact-form plugin's phpmailer_init hook. Defaults point at the mail service below,
      # so outgoing mail is caught locally unless these are overridden in .env
      SMTP_HOST: "${SMTP_HOST:-mail}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_SECURE: "${SMTP_SECURE:-}" # empty for plain SMTP, "tls" (STARTTLS) or "ssl" for a real server
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
    depends_on:
      - db
      - mail
    links:
      - db

  # PHPMyAdmin will be available at http://localhost:8080
  pma:
    image: phpmyadmin:latest  # https://hub.docker.com/_/phpmyadmin
    environment:
      # https://docs.phpmyadmin.net/en/latest/setup.html#docker-environment-variables
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      UPLOAD_LIMIT: 50M
    ports:
      - "${IP}:8080:80"
    links:
      - db:db
    volumes:
      - ./config/pma_php.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./config/pma_config.php:/etc/phpmyadmin/config.user.inc.php

  # Catches every message wp_mail() sends in development so nothing reaches a real inbox.
  # Read the caught mail in the web inbox at ${IP}:8025
  mail:
    image: axllent/mailpit:latest # https://mailpit.axllent.org/
    ports:
      - "${IP}:8025:8025" # Web UI inbox. SMTP stays on the internal network at mail:1025
    environment:
      # accept any credentials over an unencrypted connection, so the same plugin code path works
      # here and against a real SMTP server
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  db:
    image: mysql:latest # https://hub.docker.com/_/mysql/ - or mariadb https://hub.docker.com/_/mariadb
    # platform: linux/x86_64  # Uncomment if your machine is running on arm (ex: Apple Silicon processor)
    ports:
      - "${IP}:3306:3306" # change ip if required
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci'
    ]
    volumes:
      - ./wp-data:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"

volumes:
  db_data:
